name: Build debug APK

on:
  push:
    branches: [main, claude/ios-fitness-alarm-app-su6nms]
    paths: ["android-app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wakerep-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Rename APK for a stable download filename
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk wakerep.apk

      - name: Publish/update the "latest" release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Wakerep - latest debug build"
          body: |
            Automatically rebuilt from `${{ github.sha }}` on every push to `android-app/**`.
            This is a debug-signed APK for sideloading/testing only, not a Play Store release.

            Download: `wakerep.apk` below, or use the direct link:
            https://github.com/${{ github.repository }}/releases/download/debug-latest/wakerep.apk
          files: wakerep.apk
          prerelease: true

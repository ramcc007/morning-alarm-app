name: MorningAlarm
options:
  bundleIdPrefix: com.morningalarm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  MorningAlarm:
    type: application
    platform: iOS
    sources:
      - path: MorningAlarm
        excludes:
          - "Configuration/*.storekit"
    resources:
      - path: MorningAlarm/Resources
        excludes:
          - "Info.plist"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morningalarm.app
        PRODUCT_NAME: MorningAlarm
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: MorningAlarm/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "MorningAlarm needs the front camera to watch and count your pushups so it knows when to stop the alarm."
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: "MorningAlarm"

schemes:
  MorningAlarm:
    build:
      targets:
        MorningAlarm: all
    run:
      config: Debug
    archive:
      config: Release
